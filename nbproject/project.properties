build.dir=build
build.generated.dir=${build.dir}/generated
build.generated.sources.dir=${build.dir}/generated-sources
build.sysclasspath=ignore
build.test.classes.dir=${build.dir}/test/classes
build.test.results.dir=${build.dir}/test/results
dist.archive.excludes=
dist.dir=dist
dist.jar=${dist.dir}/thuvien.jar
dist.javadoc.dir=${dist.dir}/javadoc
excludes=
includes=**
jar.compress=false

file.reference.mysql-connector=lib/mysql-connector-java-8.0.33.jar
file.reference.hikaricp=lib/HikariCP-4.0.3.jar
file.reference.slf4j-api=lib/slf4j-api-1.7.36.jar
file.reference.slf4j-jul=lib/slf4j-jdk14-1.7.36.jar
file.reference.junit=lib/junit-4.13.2.jar
file.reference.hamcrest=lib/hamcrest-core-1.3.jar

javac.classpath=\
    ${file.reference.mysql-connector}:\
    ${file.reference.hikaricp}:\
    ${file.reference.slf4j-api}:\
    ${file.reference.slf4j-jul}

javac.compilerargs=
javac.deprecation=false
